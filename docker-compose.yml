services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semantic-engine-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=doc-semantic-equivalence-engine
      - ENVIRONMENT=production
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VLLM_API_BASE=http://vllm-mock:8001/v1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - qdrant
      - otel-collector
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semantic-engine-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: semantic-engine-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: semantic-engine-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

volumes:
  qdrant_storage:
